<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>MONITOR · 手机取景</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e; color: #e8e8e8;
    font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 560px; display: flex; align-items: baseline; gap: 10px; padding: 6px 2px 12px; }
  header b { font-size: 18px; letter-spacing: 2px; }
  header span { color: #888; font-size: 13px; }
  #stage { width: 100%; max-width: 560px; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
  video { width: 100%; display: block; transform-origin: center; }
  #badge {
    position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; background: rgba(0,0,0,.55); color: #bbb; backdrop-filter: blur(4px);
  }
  #badge.ok { color: #50c878; }
  #badge.err { color: #e65a5a; }
  .panel { width: 100%; max-width: 560px; background: #1b1b1b; border-radius: 12px; padding: 14px; margin-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
  .row label { color: #aaa; font-size: 14px; flex: none; }
  select, button {
    background: #2a2a2a; color: #e8e8e8; border: 1px solid #3a3a3a; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; min-width: 0;
  }
  select { flex: 1; max-width: 60%; }
  button { cursor: pointer; }
  button:active { background: #3a3a3a; }
  #toggle { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; background: #1f4d33; border-color: #2c6b47; color: #7ee2a8; margin-top: 10px; }
  #toggle.off { background: #2a2a2a; border-color: #3a3a3a; color: #e8e8e8; }
  .hint { color: #777; font-size: 12px; margin-top: 12px; max-width: 560px; text-align: center; }
  #err { color: #e65a5a; font-size: 13px; margin-top: 10px; max-width: 560px; text-align: center; display: none; }
  .stats { display: flex; gap: 16px; color: #888; font-size: 12px; padding-top: 8px; }
  .stats b { color: #ccc; font-weight: 600; }
</style>
</head>
<body>
<header><b>MONITOR</b><span>手机无线取景</span></header>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="badge">未连接</div>
</div>
<div id="err"></div>
<div class="panel">
  <div class="row"><label>摄像头</label><select id="cam"></select></div>
  <div class="row"><label>分辨率</label>
    <select id="res">
      <option value="640">640（省流量）</option>
      <option value="960" selected>960（推荐）</option>
      <option value="1280">1280（高清）</option>
    </select>
  </div>
  <div class="row"><label>帧率</label>
    <select id="fps">
      <option value="15">15 fps</option>
      <option value="24" selected>24 fps</option>
      <option value="30">30 fps</option>
    </select>
  </div>
  <div class="row"><label>镜像发送</label><input type="checkbox" id="mirror" style="width:22px;height:22px"></div>
  <button id="toggle" class="off">开始发送</button>
  <div class="stats"><span>状态 <b id="st">未连接</b></span><span>发送 <b id="sf">0</b> fps</span><span>画面 <b id="dim">—</b></span><span>画质 <b id="q">0.80</b></span><span>跳过 <b id="sk">0</b></span></div>
</div>
<p class="hint">手机与电脑需在同一 Wi-Fi。首次打开若提示证书不受信任，请选择「继续访问」；想彻底不弹提示可<a href="/cert" style="color:#7ee2a8">安装证书</a>。<br>保持本页面在前台且屏幕常亮，锁屏或切后台会中断发送。</p>
<p class="hint" id="note"></p>
<script>
"use strict";
const $ = id => document.getElementById(id);
const video = $("video"), badge = $("badge"), canvas = document.createElement("canvas");
const ctx2d = canvas.getContext("2d", { alpha: false });
// 黑帧探测：把刚画好的画面缩到 16×9 读平均亮度。安卓上偶尔会抓到一帧全黑的
// canvas（视频轨道瞬断、上下文被回收），这种帧发到电脑上就是一整块闪黑。
const probe = document.createElement("canvas");
probe.width = 16; probe.height = 9;
const probeCtx = probe.getContext("2d", { willReadFrequently: true });
const DARK_LEVEL = 4;   // 平均亮度低于此值视作黑帧（真正的暗场景仍在 10 以上）
const token = new URLSearchParams(location.search).get("t") || "";
const ua = navigator.userAgent;
const platform = /iPhone|iPad|iPod/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android 手机" : "手机";
let ws = null, stream = null, sending = false, wakeLock = null;
let sent = 0, skipped = 0, devices = [], camIndex = 0;
let transport = "ws", wsReady = false, wsFails = 0, postFails = 0, retryTimer, postAbort;
let probeDelay = 20000, probeAt = Infinity, probeOnNextPost = true;
let autoStart = true, pairingExpired = false, starting = false, pageSuspended = false;
// 限制同一时间只有一条上行；旧循环的异步结果不得进入新连接。
let loopGen = 0;
// 实时性控制
// 画质自适应：Wi-Fi 好时 0.8，弱网时降到 0.42 换帧率。JPEG 字节数直接决定空中时间。
let quality = 0.8, lastAdapt = -Infinity, qWarned = false;
const MAX_IN_FLIGHT = 3, NETWORK_TIMEOUT = 4000;
let sentFrames = 0, ackedFrames = 0, pendingSends = [], rttEwma = 0;

function badgeSet(text, cls) { badge.textContent = text; badge.className = cls || ""; $("st").textContent = text; }
function errShow(msg) { const e = $("err"); e.innerHTML = msg || ""; e.style.display = msg ? "block" : "none"; }
function note(msg) { const n = $("note"); if (n) n.textContent = msg || ""; }
function frameInterval() { return 1000 / (Number($("fps").value) || 24); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function onAck(n) {
  if (!Number.isSafeInteger(n) || n <= ackedFrames || n > sentFrames) return;
  ackedFrames = n;
  const sentAt = pendingSends.find(p => p.n === n)?.at;
  while (pendingSends.length && pendingSends[0].n <= n) pendingSends.shift();
  if (sentAt === undefined) return;
  const rtt = performance.now() - sentAt;
  rttEwma = rttEwma ? rttEwma * 0.8 + rtt * 0.2 : rtt;
  if (wsFails || badge.textContent !== "已连接") badgeSet("已连接", "ok");
  wsFails = 0;
  probeDelay = 20000;
  adaptQuality(rttEwma, 2);
}

function adaptQuality(rtt, periods) {
  const now = performance.now();
  const budget = frameInterval() * periods;
  let q = quality;
  if (rtt > budget && now - lastAdapt >= 400) q -= 0.08;
  else if (rtt < budget * 0.6 && now - lastAdapt >= 1800) q += 0.04;
  q = Math.round(Math.max(0.42, Math.min(0.8, q)) * 100) / 100;
  if (q === quality) return;
  quality = q;
  lastAdapt = now;
  $("q").textContent = quality.toFixed(2);
  if (quality <= 0.62 && !qWarned) {
    qWarned = true;
    note("上行偏慢：已降低 JPEG 画质以保持流畅");
  } else if (quality >= 0.78 && qWarned) {
    qWarned = false;
    note("");
  }
}
function setToggle(on) {
  $("toggle").textContent = on ? "暂停发送" : "开始发送";
  $("toggle").className = on ? "" : "off";
}

function deviceName() {
  const track = stream && stream.getVideoTracks()[0];
  const label = track && track.label ? track.label : "";
  return label ? platform + " · " + label : platform;
}

async function listCameras() {
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    devices = list.filter(d => d.kind === "videoinput");
    const sel = $("cam");
    sel.innerHTML = "";
    devices.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = d.label || ("摄像头 " + (i + 1));
      sel.appendChild(o);
    });
    if (devices.length > 1) {
      const back = devices.findIndex(d => /back|rear|environment|后置/i.test(d.label));
      if (back >= 0) { camIndex = back; sel.value = back; }
    }
  } catch (e) { /* 权限未授予时忽略 */ }
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const width = parseInt($("res").value, 10);
  const video_ = { width: { ideal: width }, height: { ideal: Math.round(width * 9 / 16) } };
  if (devices[camIndex] && devices[camIndex].deviceId) video_.deviceId = { exact: devices[camIndex].deviceId };
  else video_.facingMode = "environment";
  stream = await navigator.mediaDevices.getUserMedia({ video: video_, audio: false });
  video.srcObject = stream;
  await video.play().catch(() => {});
  await listCameras();
  errShow("");
}

let probeTick = 0;
function isBlack() {
  // 每三帧查一次就够：真出黑帧时是连续成片的，抽样不会漏。
  // 取样从 video 直接缩到 16×9，绝不从大 canvas 回读 —— Android 上
  // drawImage(大 canvas) + getImageData 要同步读回显存，960 这种分辨率
  // 每帧都做会把抓帧拖慢（用户实测 960 闪、640 稳，差别就在这一次回读）。
  if (probeTick++ % 3 !== 0) return false;
  try {
    if (!(video.readyState >= 2 && video.videoWidth > 0)) return false;
    probeCtx.drawImage(video, 0, 0, probe.width, probe.height);
    const px = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
    const n = px.length / 4;
    if (!n) return false;
    let sum = 0;
    for (let i = 0; i < px.length; i += 4) sum += (px[i] + px[i + 1] + px[i + 2]) / 3;
    return sum / n < DARK_LEVEL;
  } catch (e) {
    return false;
  }
}

async function grab() {
  if (!(video.readyState >= 2 && video.videoWidth > 0)) return null;
  if (isBlack()) { skipped++; $("sk").textContent = skipped; return null; }
  // ideal 只是采集建议，部分手机会返回更大的画面。编码尺寸以所选档位为上限。
  const scale = Math.min(1, (Number($("res").value) || 960) / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.max(1, Math.round(video.videoWidth * scale));
  const h = Math.max(1, Math.round(video.videoHeight * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; $("dim").textContent = w + "×" + h; }
  ctx2d.save();
  if ($("mirror").checked) { ctx2d.translate(w, 0); ctx2d.scale(-1, 1); }
  ctx2d.drawImage(video, 0, 0, w, h);
  ctx2d.restore();
  return new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
}

function closeSocket() {
  clearTimeout(retryTimer);
  wsReady = false;
  const old = ws;
  ws = null;
  if (old) old.close();
}

function stopTransport() {
  loopGen++;
  closeSocket();
  postAbort?.abort();
  postAbort = null;
}

function rejectPairing() {
  pairingExpired = true;
  pauseSending();
  $("toggle").disabled = true;
  badgeSet("配对失效", "err");
  errShow("配对码无效：请重新扫描电脑上的二维码。");
}

function startLoop() {
  const gen = ++loopGen;
  const sock = transport === "ws" ? ws : null;
  const current = () => gen === loopGen && sending;
  (async () => {
    while (current()) {
      // 探测期间仍用 POST；握手成功后，等在途 POST 结束才切换发送通道。
      if (!sock && wsReady) {
        transport = "ws";
        startLoop();
        return;
      }
      const t0 = performance.now();
      // 不排队编码新帧；把 Wi-Fi 的容量用在尽可能新的画面上。
      if (sock && (pendingSends.length >= MAX_IN_FLIGHT || sock.bufferedAmount > 524288)) {
        await sleep(8);
        continue;
      }
      const blob = await grab();
      if (!current()) return;
      if (blob) {
        if (sock) {
          try { sock.send(blob); } catch (e) { failSocket(sock); return; }
          pendingSends.push({ n: ++sentFrames, at: performance.now() });
          if (pendingSends.length === 1) armAckDeadline(sock);
        } else {
          await uploadFrame(blob, current);
        }
      }
      const wait = frameInterval() - (performance.now() - t0);
      if (current() && wait > 0) await sleep(wait);
    }
  })();
}

function armAckDeadline(sock) {
  clearTimeout(retryTimer);
  if (pendingSends.length) {
    const remaining = NETWORK_TIMEOUT - (performance.now() - pendingSends[0].at);
    retryTimer = setTimeout(() => failSocket(sock), Math.max(0, remaining));
  }
}

async function uploadFrame(blob, current) {
  const ac = new AbortController();
  postAbort = ac;
  const timeout = setTimeout(() => ac.abort(), NETWORK_TIMEOUT);
  const sentAt = performance.now();
  try {
    const url = "/frame?t=" + encodeURIComponent(token) + "&name=" + encodeURIComponent(deviceName());
    const r = await fetch(url, { method: "POST", cache: "no-store", headers: { "Content-Type": "image/jpeg" }, body: blob, signal: ac.signal });
    if (!current()) return;
    if (r.status === 403) { rejectPairing(); return; }
    if (!r.ok) throw new Error("电脑返回 " + r.status);
    sent++;
    postFails = 0;
    if (badge.textContent !== "已连接 · 逐帧") badgeSet("已连接 · 逐帧", "ok");
    adaptQuality(performance.now() - sentAt, 1);
    if (probeOnNextPost) {
      probeOnNextPost = false;
      probeAt = performance.now() + probeDelay;
    } else if (!ws && performance.now() >= probeAt) {
      probeDelay = Math.min(probeDelay * 2, 120000);
      probeAt = performance.now() + probeDelay;
      connect();
    }
  } catch (e) {
    if (!current()) return;
    badgeSet("重连中…", "err");
    const backoff = Math.min(500 * 2 ** postFails, 8000);
    if (++postFails >= 5) {
      postFails = 0;
      stopTransport();
      retryTimer = setTimeout(tryWebSocket, backoff);
    } else {
      await sleep(backoff);
    }
  } finally {
    clearTimeout(timeout);
    if (postAbort === ac) postAbort = null;
  }
}

function tryWebSocket() {
  if (!sending || document.hidden || pageSuspended) return;
  stopTransport();
  transport = "ws";
  connect();
}

function failSocket(sock) {
  if (ws !== sock || !sending) return;
  if (transport === "post") { closeSocket(); return; }
  stopTransport();
  badgeSet("重连中…", "err");
  if (++wsFails >= 2) {
    transport = "post";
    probeOnNextPost = true;
    badgeSet("改用逐帧上传…");
    startLoop();
  } else {
    retryTimer = setTimeout(connect, 1000);
  }
}

function connect() {
  if (!sending || document.hidden || pageSuspended || ws) return;
  if (transport === "ws") badgeSet("连接中…");
  let sock;
  try { sock = new WebSocket("wss://" + location.host + "/ws"); }
  catch (e) { failSocket(null); return; }
  ws = sock;
  const fail = () => failSocket(sock);
  const sendInfo = (message) => {
    try { sock.send(JSON.stringify(message)); } catch (e) { fail(); }
  };
  retryTimer = setTimeout(fail, NETWORK_TIMEOUT);
  sock.onopen = () => {
    if (ws === sock) sendInfo({ type: "hello", name: deviceName(), token });
  };
  sock.onclose = sock.onerror = fail;
  sock.onmessage = ({ data }) => {
    if (ws !== sock || typeof data !== "string") return;
    let m;
    try { m = JSON.parse(data); } catch (e) { return; }
    if (m?.type === "error" && m.message === "配对码无效") { rejectPairing(); return; }
    if (m?.type === "hello-ok" && !wsReady) {
      wsReady = true;
      clearTimeout(retryTimer);
      sentFrames = 0; ackedFrames = 0; pendingSends = []; rttEwma = 0;
      if (transport === "ws") startLoop();
    } else if (m?.type === "ack" && wsReady) {
      const before = ackedFrames;
      onAck(m.n);
      sent += ackedFrames - before;
      if (ackedFrames !== before) armAckDeadline(sock);
    }
  };
}

async function keepAwake() {
  if (wakeLock || !navigator.wakeLock) return;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (!sending || document.hidden || wakeLock) { await lock.release(); return; }
    wakeLock = lock;
    lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
  } catch (e) { /* 某些浏览器不支持屏幕唤醒锁 */ }
}

async function startSending() {
  if (sending || starting || pairingExpired) return;
  starting = true;
  try {
    if (!stream) await openCamera();
  } catch (e) {
    errShow(e && e.name === "NotAllowedError" ? "相机权限被拒绝：请在浏览器设置里允许访问相机，然后重新载入本页。"
      : "无法打开相机：" + (e && e.message ? e.message : e));
    return;
  } finally { starting = false; }
  if (!autoStart) return;
  sending = true;
  wsFails = postFails = 0;
  probeDelay = 20000;
  setToggle(true);
  tryWebSocket();
  keepAwake();
}

function pauseSending() {
  sending = autoStart = false;
  stopTransport();
  setToggle(false);
  badgeSet("已暂停");
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

$("toggle").onclick = () => {
  if (sending) { pauseSending(); return; }
  autoStart = true;
  startSending();
};
$("cam").onchange = async () => {
  camIndex = parseInt($("cam").value, 10) || 0;
  try {
    await openCamera();
    if (ws?.readyState === 1) ws.send(JSON.stringify({ type: "name", name: deviceName() }));
  } catch (e) { errShow("切换摄像头失败：" + e.message); }
};
$("res").onchange = async () => { if (stream) { try { await openCamera(); } catch (e) {} } };
$("mirror").onchange = () => { video.style.transform = $("mirror").checked ? "scaleX(-1)" : ""; };
setInterval(() => { $("sf").textContent = sent; sent = 0; }, 1000);
function resumeTransport() {
  if (!sending || document.hidden || pageSuspended) return;
  // iOS 可能冻结旧请求。恢复时重建上行，不等待旧请求返回。
  stopTransport();
  if (transport === "post") startLoop();
  else connect();
  keepAwake();
}
document.addEventListener("visibilitychange", () => {
  if (!sending || pageSuspended) return;
  if (document.hidden) stopTransport();
  else resumeTransport();
});
document.addEventListener("pointerdown", (e) => {
  if (e.target?.closest?.("#toggle") || !autoStart) return;
  startSending();
}, { passive: true });
window.addEventListener("pagehide", () => {
  pageSuspended = true;
  stopTransport();
  if (sending) {
    try { navigator.sendBeacon("/bye?t=" + encodeURIComponent(token)); } catch (e) {}
  }
});
window.addEventListener("pageshow", (e) => {
  pageSuspended = false;
  if (e.persisted) resumeTransport();
});

if (navigator.mediaDevices?.getUserMedia) startSending();
else errShow("此浏览器不支持相机访问，请使用 Safari / Chrome。");
</script>
</body>
</html>
