<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>MONITOR · 手机取景</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e; color: #e8e8e8;
    font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 560px; display: flex; align-items: baseline; gap: 10px; padding: 6px 2px 12px; }
  header b { font-size: 18px; letter-spacing: 2px; }
  header span { color: #888; font-size: 13px; }
  #stage { width: 100%; max-width: 560px; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
  video { width: 100%; display: block; transform-origin: center; }
  #badge {
    position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; background: rgba(0,0,0,.55); color: #bbb; backdrop-filter: blur(4px);
  }
  #badge.ok { color: #50c878; }
  #badge.err { color: #e65a5a; }
  .panel { width: 100%; max-width: 560px; background: #1b1b1b; border-radius: 12px; padding: 14px; margin-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
  .row label { color: #aaa; font-size: 14px; flex: none; }
  select, button {
    background: #2a2a2a; color: #e8e8e8; border: 1px solid #3a3a3a; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; min-width: 0;
  }
  select { flex: 1; max-width: 60%; }
  button { cursor: pointer; }
  button:active { background: #3a3a3a; }
  #toggle { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; background: #1f4d33; border-color: #2c6b47; color: #7ee2a8; margin-top: 10px; }
  #toggle.off { background: #2a2a2a; border-color: #3a3a3a; color: #e8e8e8; }
  .hint { color: #777; font-size: 12px; margin-top: 12px; max-width: 560px; text-align: center; }
  #err { color: #e65a5a; font-size: 13px; margin-top: 10px; max-width: 560px; text-align: center; display: none; }
  .stats { display: flex; gap: 16px; color: #888; font-size: 12px; padding-top: 8px; }
  .stats b { color: #ccc; font-weight: 600; }
</style>
</head>
<body>
<header><b>MONITOR</b><span>手机无线取景</span></header>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="badge">未连接</div>
</div>
<div id="err"></div>
<div class="panel">
  <div class="row"><label>摄像头</label><select id="cam"></select></div>
  <div class="row"><label>分辨率</label>
    <select id="res">
      <option value="640">640（省流量）</option>
      <option value="960" selected>960（推荐）</option>
      <option value="1280">1280（高清）</option>
    </select>
  </div>
  <div class="row"><label>帧率</label>
    <select id="fps">
      <option value="15">15 fps</option>
      <option value="24" selected>24 fps</option>
      <option value="30">30 fps</option>
    </select>
  </div>
  <div class="row"><label>镜像发送</label><input type="checkbox" id="mirror" style="width:22px;height:22px"></div>
  <button id="toggle" class="off">开始发送</button>
  <div class="stats"><span>状态 <b id="st">未连接</b></span><span>发送 <b id="sf">0</b> fps</span><span>画面 <b id="dim">—</b></span><span>跳过 <b id="sk">0</b></span></div>
</div>
<p class="hint">手机与电脑需在同一 Wi-Fi。首次打开若提示证书不受信任，请选择「继续访问」；想彻底不弹提示可<a href="/cert" style="color:#7ee2a8">安装证书</a>。<br>保持本页面在前台且屏幕常亮，锁屏或切后台会中断发送。</p>
<p class="hint" id="note"></p>
<script>
"use strict";
const $ = id => document.getElementById(id);
const video = $("video"), badge = $("badge"), canvas = document.createElement("canvas");
const ctx2d = canvas.getContext("2d");
// 黑帧探测：把刚画好的画面缩到 16×9 读平均亮度。安卓上偶尔会抓到一帧全黑的
// canvas（视频轨道瞬断、上下文被回收），这种帧发到电脑上就是一整块闪黑。
const probe = document.createElement("canvas");
probe.width = 16; probe.height = 9;
const probeCtx = probe.getContext("2d", { willReadFrequently: true });
const DARK_LEVEL = 4;   // 平均亮度低于此值视作黑帧（真正的暗场景仍在 10 以上）
const token = new URLSearchParams(location.search).get("t") || "";
const ua = navigator.userAgent;
const platform = /iPhone|iPad|iPod/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android 手机" : "手机";
let ws = null, stream = null, sending = false, timer = null, wakeLock = null;
let sent = 0, skipped = 0, devices = [], camIndex = 0, reconnectDelay = 1000;
// transport: "ws" = WSS 推流（首选）；"post" = 同源 HTTPS 逐帧上行（WSS 被证书/网络拦下时兜底）
let transport = "ws", wsFails = 0, postFails = 0, switches = 0, posting = false;
let autoStart = true;  // 用户手动「暂停发送」后不再自动开始
// 发送循环代号：每次重建循环加一，旧循环（可能卡在 await fetch 里）在下一个边界自行退出。
let loopGen = 0, lastSent = Date.now(), hiddenAt = 0;

function badgeSet(text, cls) { badge.textContent = text; badge.className = cls || ""; $("st").textContent = text; }
function errShow(msg) { const e = $("err"); e.innerHTML = msg || ""; e.style.display = msg ? "block" : "none"; }
function note(msg) { const n = $("note"); if (n) n.textContent = msg || ""; }
function fps() { return Math.max(1, parseInt($("fps").value, 10) || 24); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setToggle(on) {
  $("toggle").textContent = on ? "暂停发送" : "开始发送";
  $("toggle").className = on ? "" : "off";
}

function deviceName() {
  const track = stream && stream.getVideoTracks()[0];
  const label = track && track.label ? track.label : "";
  return label ? platform + " · " + label : platform;
}

async function listCameras() {
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    devices = list.filter(d => d.kind === "videoinput");
    const sel = $("cam");
    sel.innerHTML = "";
    devices.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = d.label || ("摄像头 " + (i + 1));
      sel.appendChild(o);
    });
    if (devices.length > 1) {
      const back = devices.findIndex(d => /back|rear|environment|后置/i.test(d.label));
      if (back >= 0) { camIndex = back; sel.value = back; }
    }
  } catch (e) { /* 权限未授予时忽略 */ }
}

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const width = parseInt($("res").value, 10);
  const video_ = { width: { ideal: width }, height: { ideal: Math.round(width * 9 / 16) } };
  if (devices[camIndex] && devices[camIndex].deviceId) video_.deviceId = { exact: devices[camIndex].deviceId };
  else video_.facingMode = "environment";
  stream = await navigator.mediaDevices.getUserMedia({ video: video_, audio: false });
  video.srcObject = stream;
  await video.play().catch(() => {});
  await listCameras();
  errShow("");
}

function isBlack() {
  try {
    probeCtx.drawImage(canvas, 0, 0, probe.width, probe.height);
    const px = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
    const n = px.length / 4;
    if (!n) return false;
    let sum = 0;
    for (let i = 0; i < px.length; i += 4) sum += (px[i] + px[i + 1] + px[i + 2]) / 3;
    return sum / n < DARK_LEVEL;
  } catch (e) {
    return false;
  }
}

async function grab() {
  if (!(video.readyState >= 2 && video.videoWidth > 0)) return null;
  const w = video.videoWidth, h = video.videoHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; $("dim").textContent = w + "×" + h; }
  ctx2d.save();
  if ($("mirror").checked) { ctx2d.translate(w, 0); ctx2d.scale(-1, 1); }
  ctx2d.drawImage(video, 0, 0, w, h);
  ctx2d.restore();
  if (isBlack()) { skipped++; $("sk").textContent = skipped; return null; }
  return new Promise(res => canvas.toBlob(res, "image/jpeg", 0.8));
}

/** 首选：每帧一个二进制 WebSocket 消息。串行抓帧再发送，避免多帧并发导致旧帧后到。 */
function startLoop() {
  stopLoop();
  loopGen++;
  if (transport === "post") { startPost(); return; }
  const gen = loopGen;
  (async function tick() {
    while (gen === loopGen && sending && transport === "ws") {
      const t0 = Date.now();
      if (!ws || ws.readyState !== 1) { await sleep(120); continue; }
      if (ws.bufferedAmount > 1048576) { await sleep(40); continue; }
      const blob = await grab();
      if (gen !== loopGen || !sending) return;
      if (blob && ws && ws.readyState === 1 && ws.bufferedAmount < 1048576) {
        ws.send(blob); sent++; lastSent = Date.now();
      }
      const wait = 1000 / fps() - (Date.now() - t0);
      if (wait > 0) await sleep(wait);
    }
  })();
}

/** 重建发送循环：旧循环可能因为 iOS 把页面冻结而永远卡在 await 里。 */
function restartLoop() {
  loopGen++;
  posting = false;
  stopLoop();
  if (sending) startLoop();
}

/** 兜底：逐帧 POST，等响应再发下一帧（TLS 连接复用，不会堆积）。 */
async function startPost() {
  if (posting) return;
  posting = true;
  const gen = loopGen;
  while (sending && transport === "post" && gen === loopGen) {
    const t0 = Date.now();
    const blob = await grab();
    if (blob) {
      try {
        const url = "/frame?t=" + encodeURIComponent(token) + "&name=" + encodeURIComponent(deviceName());
        // 单帧超时：网络被系统挂起时 fetch 可能永远不返回，不设上限整个循环会僵死。
        const ac = new AbortController();
        const to = setTimeout(() => { try { ac.abort(); } catch (e) {} }, 8000);
        try {
          const r = await fetch(url, { method: "POST", cache: "no-store", headers: { "Content-Type": "image/jpeg" }, body: blob, signal: ac.signal });
          if (r.status === 403) { errShow("配对码无效：请重新扫描电脑上的二维码。"); sending = false; setToggle(false); break; }
          if (!r.ok) throw new Error("电脑返回 " + r.status);
          sent++; postFails = 0; lastSent = Date.now();
          if (badge.textContent !== "已连接") { badgeSet("已连接", "ok"); note(""); }
        } finally { clearTimeout(to); }
      } catch (e) {
        postFails++;
        badgeSet("重连中…", "err");
        note("上行中断，正在重试…");
        if (postFails >= 5) { postFails = 0; transport = "ws"; wsFails = 0; posting = false; connect(); return; }
        await sleep(400);
        continue;
      }
    }
    const wait = 1000 / fps() - (Date.now() - t0);
    if (wait > 0) await sleep(wait);
  }
  if (gen === loopGen) posting = false;
}

function stopLoop() { if (timer) { clearTimeout(timer); timer = null; } }

/** WSS 连不上时切到逐帧上行：证书被拦的环境里，同源 fetch 往往仍然可用。 */
function switchToPost(reason) {
  if (transport === "post") return;
  if (++switches > 4) { errShow("连不上电脑：请确认手机与电脑在同一 Wi-Fi，然后重新扫码。"); return; }
  transport = "post";
  try { if (ws) ws.close(); } catch (e) {}
  ws = null;
  errShow("");
  note(reason || "已改用逐帧上传");
  if (!sending && autoStart) { startSending(); } else { startLoop(); }
}

function connect() {
  if (transport === "post") return;
  badgeSet("连接中…");
  const sock = new WebSocket("wss://" + location.host + "/ws");
  ws = sock;
  sock.onopen = () => {
    if (ws !== sock) return;
    reconnectDelay = 1000; wsFails = 0;
    badgeSet("已连接", "ok");
    errShow("");
    sock.send(JSON.stringify({ type: "hello", name: deviceName(), token }));
    // 打开页面就开始送画面，不再要求用户手动点「开始发送」
    if (sending) { startLoop(); } else if (autoStart) { startSending(); }
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    if (transport === "post") return;
    stopLoop();
    ws = null;
    wsFails++;
    if (wsFails >= 2) { switchToPost("加密 WebSocket 连不上，已改用逐帧上传（画面仍可正常显示）"); return; }
    badgeSet("重连中…", "err");
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.6, 8000);
  };
  sock.onerror = () => { try { sock.close(); } catch (e) {} };
}

async function startSending() {
  if (sending) return true;
  try {
    if (!stream) await openCamera();
  } catch (e) {
    errShow(e && e.name === "NotAllowedError" ? "相机权限被拒绝：请在浏览器设置里允许访问相机，然后重新载入本页。"
      : "无法打开相机：" + (e && e.message ? e.message : e));
    return false;
  }
  sending = true;
  lastSent = Date.now();
  setToggle(true);
  if (transport === "ws" && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "name", name: deviceName() }));
  startLoop();
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  return true;
}

function pauseSending() {
  sending = false;
  autoStart = false;
  stopLoop();
  setToggle(false);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

$("toggle").onclick = async () => {
  if (sending) { pauseSending(); return; }
  autoStart = true;
  await startSending();
};
$("cam").onchange = async () => {
  camIndex = parseInt($("cam").value, 10) || 0;
  try { await openCamera(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "name", name: deviceName() })); }
  catch (e) { errShow("切换摄像头失败：" + e.message); }
};
$("res").onchange = async () => { if (stream) { try { await openCamera(); } catch (e) {} } };
$("mirror").onchange = () => { video.style.transform = $("mirror").checked ? "scaleX(-1)" : ""; };
setInterval(() => { $("sf").textContent = sent; sent = 0; }, 1000);
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); }, 5000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!sending) return;
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  hiddenAt = 0;
  // iOS 会把后台页面的 JS 冻结：回到前台后必须重建循环，否则循环可能永远卡在 await 上。
  lastSent = Date.now();
  if (transport === "ws" && away > 3000) {
    // 后台期间这条 socket 多半已经假死（send 不报错但对面收不到），直接换一条。
    try { if (ws) ws.close(); } catch (e) {}
    ws = null;
    connect();
  }
  restartLoop();
  if (!wakeLock && navigator.wakeLock) { navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); }
});
// 看门狗：发送中却连续 6 秒没成功送出一帧，就重建循环（覆盖系统冻结、连接假死）。
setInterval(() => {
  if (!sending) return;
  if (Date.now() - lastSent < 6000) return;
  lastSent = Date.now();
  badgeSet("重连中…", "err");
  note("画面停住了，正在自动恢复…");
  restartLoop();
}, 3000);
// 部分 iOS 版本要用户点一下页面才给相机权限：首次触摸补一次自动开始。
document.addEventListener("pointerdown", (e) => {
  if (e.target && e.target.closest && e.target.closest("#toggle")) return;
  if (sending || !autoStart || stream) return;
  startSending();
}, { passive: true });

window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon("/bye?t=" + encodeURIComponent(token)); } catch (e) {}
});

(async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errShow("此浏览器不支持相机访问，请使用 Safari / Chrome。"); return;
  }
  try { await openCamera(); } catch (e) {
    errShow("等待相机权限：允许访问相机后会自动开始发送。");
  }
  connect();
})();
</script>
</body>
</html>
